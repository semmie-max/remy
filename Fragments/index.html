<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragments | Remomhe</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../common.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/images/remomhe.png">
<link rel="apple-touch-icon" href="/images/remomhe.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <script src="../common.js"></script>

  <section class="frag-hero">
    <p class="frag-line" data-frag-blur>I’m made up of a few contradictions.</p>
    <p class="frag-line" data-frag-blur>If I had to describe myself, I’d probably need a few attempts.</p>

    <div class="frag-note">
      <div class="frag-note-label">
        <p class="frag-note-text">For no<br>particular <br> reason</p>
        <svg class="frag-note-arrow" viewBox="0 0 160 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10,10 C40,4 18,34 44,40 C70,46 48,64 76,64 C96,64 104,58 124,62"
                stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M112,50 L128,62 L112,74" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
            <div class="frag-note-photos" id="fragPhotos">
        <div class="frag-polaroid">
          <img src="/images/me.jpg" alt="">
          <p class="frag-polaroid-caption">---</p>
        </div>
        <div class="frag-polaroid">
          <img src="/images/spid.jpg" alt="">
          <p class="frag-polaroid-caption">#</p>
        </div>
        <div class="frag-polaroid">
          <img src="/images/remomhe.png" alt="">
          <p class="frag-polaroid-caption">@</p>
        </div>
      </div>
    </div>
  </section>
  <!-- PLAYLIST SECTION START -->
<section class="playlist-section">
  <div class="playlist-card">

    <div class="playlist-header">
      <div class="playlist-title-group">
        <svg class="playlist-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
        <h3 id="playlistName">My Playlist</h3>
      </div>
      <span class="playlist-badge">soundtracking my days</span>
    </div>

    <div class="playlist-body">
      <div class="playlist-art">
        <img id="playlistCoverImg" src="" alt="">
        <p class="playlist-art-title" id="playlistCoverTitle"></p>
        <p class="playlist-art-sub" id="playlistCoverSub"></p>
      </div>

      <div class="playlist-scroll-container">
        <ul class="song-list" id="songList">
          <!-- song items get rendered in here by JS -->
        </ul>
      </div>
    </div>

    <div class="playlist-controls">
      <button id="plPrev" aria-label="Previous">⏮</button>
      <button id="plPlay" aria-label="Play">▶</button>
      <button id="plNext" aria-label="Next">⏭</button>
      <div class="playlist-progress">
        <div class="playlist-progress-fill" id="plProgressFill"></div>
      </div>
    </div>

  </div>
</section>
<!-- PLAYLIST SECTION END -->

  
  <script src="../script.js"></script>
</body>
</html>
